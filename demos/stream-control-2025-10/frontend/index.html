<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Stream Control — Demo</title>
<style>
  :root { --fg:#111; --muted:#666; --bg:#fafafa; --card:#fff; --ok:#116329; --warn:#9a6700; --bad:#cf222e; --info:#0969da; }
  body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:2rem;background:var(--bg);color:var(--fg)}
  h1{margin:0 0 1rem 0}
  .row{display:flex;gap:.5rem;align-items:center;margin-bottom:.75rem;flex-wrap:wrap}
  .card{background:var(--card);border:1px solid #e5e5e5;border-radius:12px;padding:1rem;margin:1rem 0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .pill{padding:.2rem .6rem;border-radius:999px;font-size:.85rem}
  .online{background:#e6ffec;color:var(--ok)}
  .offline{background:#ffebe9;color:var(--bad)}
  .streaming{background:#ddf4ff;color:var(--info)}
  .stopped{background:#fff8c5;color:var(--warn)}
  label{font-size:.9rem;color:var(--muted)}
  input,select,button{padding:.5rem .6rem;border-radius:8px;border:1px solid #d0d7de;background:#fff}
  button{cursor:pointer}
  button.primary{background:#0a66ff;border-color:#0a66ff;color:#fff}
  pre{background:#0a0a0a;color:#e5e5e5;padding:1rem;border-radius:8px;max-height:260px;overflow:auto;font-size:.9rem}
  table{width:100%;border-collapse:collapse;font-size:.92rem}
  th,td{padding:.4rem .5rem;border-bottom:1px solid #eee;text-align:left}
  .muted{color:var(--muted)}
  .spacer{flex:1}
</style>
</head>
<body>
  <h1>Stream Control</h1>

  <!-- Demo Login (API Key) -->
  <div class="card">
    <div class="row">
      <label>API Base</label>
      <input id="apiBase" size="36" placeholder="http://wise-net.io:8000"/>
      <label style="margin-left:.5rem;">API Key</label>
      <input id="apiKey" size="24" placeholder="devkey"/>
      <button id="saveAuth">Save</button>
      <span id="authStatus" class="muted"></span>
      <div class="spacer"></div>
      <button id="refreshBtn">Refresh Devices</button>
    </div>
  </div>

  <!-- Device control -->
  <div class="card">
    <div class="row">
      <label>Device</label>
      <select id="deviceSelect"></select>
      <span id="statePill" class="pill offline">offline</span>
      <span id="rateInfo" class="pill">rate: -</span>
      <span id="lastSeen" class="muted">last seen: -</span>
      <div class="spacer"></div>
      <label class="muted"><input type="checkbox" id="showAll"/> show all WS frames</label>
    </div>
    <div class="row">
      <label>Rate (Hz)</label>
      <select id="rateSel">
        <option>1</option><option selected>10</option><option>25</option><option>50</option>
      </select>
      <button id="startBtn" class="primary">Start</button>
      <button id="stopBtn">Stop</button>
      <span class="spacer"></span>
      <span class="muted">Control POSTs use <code>x-api-key</code></span>
    </div>
  </div>

  <!-- Live data -->
  <div class="card">
    <div class="row">
      <strong>Live Data</strong>
      <span class="spacer"></span>
      <span class="muted" id="streamStats">samples: 0 • rate: 0/s • ws: -</span>
    </div>
    <table>
      <thead><tr><th>ts</th><th>x</th><th>y</th><th>z</th></tr></thead>
      <tbody id="dataBody"></tbody>
    </table>
    <div class="row"><details><summary class="muted">Raw log</summary><pre id="rawLog"></pre></details></div>
  </div>

<script>
/* ---------- DOM ---------- */
const apiBaseEl   = document.getElementById('apiBase');
const apiKeyEl    = document.getElementById('apiKey');
const saveAuthBtn = document.getElementById('saveAuth');
const refreshBtn  = document.getElementById('refreshBtn');
const deviceSel   = document.getElementById('deviceSelect');
const statePill   = document.getElementById('statePill');
const rateInfo    = document.getElementById('rateInfo');
const lastSeen    = document.getElementById('lastSeen');
const startBtn    = document.getElementById('startBtn');
const stopBtn     = document.getElementById('stopBtn');
const rateSel     = document.getElementById('rateSel');
const dataBody    = document.getElementById('dataBody');
const rawLog      = document.getElementById('rawLog');
const streamStats = document.getElementById('streamStats');
const authStatus  = document.getElementById('authStatus');
const showAllCb   = document.getElementById('showAll');

/* ---------- state ---------- */
let API_BASE = localStorage.getItem('demo.apiBase') || 'http://wise-net.io:8000';
let API_KEY  = localStorage.getItem('demo.apiKey')  || 'devkey';
apiBaseEl.value = API_BASE;
apiKeyEl.value  = API_KEY;

let ws;
let wsStatus = '-';
let selectedDevice = null;
const recentTimes = []; // last 5s timestamps for rate calc
let totalSamples = 0;
const MAX_ROWS = 200;

/* ---------- utils ---------- */
function setPill(state){
  const cls = {streaming:'streaming', stopped:'stopped', online:'online', offline:'offline'}[state] || 'offline';
  statePill.className = `pill ${cls}`;
  statePill.textContent = state;
}
function headers(){
  const h = {'Content-Type': 'application/json'};
  if (API_KEY) h['x-api-key'] = API_KEY;
  return h;
}
async function getJSON(path){
  const r = await fetch(API_BASE + path, {headers: headers()});
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function postJSON(path, body){
  const r = await fetch(API_BASE + path, {
    method:'POST',
    headers: headers(),
    body: JSON.stringify(body || {})
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
const fmt = (v) => {
  const n = Number(v);
  return Number.isFinite(n) ? n.toFixed(4) : '';
};
function addRow(sample){
  const tr = document.createElement('tr');
  tr.innerHTML = `<td class="muted">${(sample.ts || '').replace('T',' ').replace('Z','')}</td>
                  <td>${fmt(sample.x)}</td>
                  <td>${fmt(sample.y)}</td>
                  <td>${fmt(sample.z)}</td>`;
  dataBody.prepend(tr);
  while (dataBody.rows.length > MAX_ROWS) dataBody.deleteRow(-1);
}
function logRaw(obj){
  rawLog.textContent = JSON.stringify(obj) + '\n' + rawLog.textContent;
  const lines = rawLog.textContent.split('\n');
  if (lines.length > 500) rawLog.textContent = lines.slice(0, 500).join('\n');
}
function updateStats(){
  const now = Date.now();
  while (recentTimes.length && now - recentTimes[0] > 5000) recentTimes.shift();
  const rate = (recentTimes.length / 5).toFixed(1);
  streamStats.textContent = `samples: ${totalSamples} • rate: ${rate}/s • ws: ${wsStatus}`;
}

/* ---------- actions ---------- */
async function refreshDevices(){
  try{
    const list = await getJSON('/api/v1/devices');
    deviceSel.innerHTML = '';
    for (const d of list){
      const opt = document.createElement('option');
      opt.value = d.device_id;
      opt.textContent = `${d.label || d.device_id} (${d.device_id})`;
      deviceSel.appendChild(opt);
    }
    if (list.length){
      selectedDevice = deviceSel.value;
      await refreshStatus();
    }else{
      selectedDevice = null;
      setPill('offline'); rateInfo.textContent='rate: -'; lastSeen.textContent='last seen: -';
    }
    authStatus.textContent = 'Devices loaded';
  }catch(err){
    authStatus.textContent = 'Failed to load devices';
    console.error(err);
  }
}

async function refreshStatus(){
  if (!selectedDevice) return;
  try{
    const s = await getJSON(`/api/v1/devices/${selectedDevice}/status`);
    setPill(s.state || 'offline');
    rateInfo.textContent = `rate: ${s.rate_hz ?? '-'}`;
    lastSeen.textContent = `last seen: ${s.last_seen || s.ts || '-'}`;
  }catch(e){
    setPill('offline');
    console.warn('status error', e);
  }
}

async function startStream(){
  if (!selectedDevice) return;
  try{
    const hz = parseInt(rateSel.value,10) || 10;
    await postJSON(`/api/devices/${selectedDevice}/start`, { rate_hz: hz }); // control path (no /v1)
    setTimeout(refreshStatus, 400);
  }catch(e){
    alert('Start failed: ' + e);
  }
}
async function stopStream(){
  if (!selectedDevice) return;
  try{
    await postJSON(`/api/devices/${selectedDevice}/stop`, {});
    setTimeout(refreshStatus, 400);
  }catch(e){
    alert('Stop failed: ' + e);
  }
}

/* ---------- websocket ---------- */
function wsUrlFromApi(api){
  const u = new URL(api);
  u.protocol = (u.protocol === 'https:') ? 'wss:' : 'ws:';
  u.pathname = '/api/v1/stream';
  u.search = '';
  return u.toString();
}
function openWS(){
  if (ws) { try { ws.close(); } catch {} ws = null; }
  if (!API_BASE) return;

  const url = wsUrlFromApi(API_BASE);
  wsStatus = 'connecting';
  updateStats();

  ws = new WebSocket(url);

  ws.onopen = () => { wsStatus = 'open'; updateStats(); console.log('[ws] open', url); };
  ws.onclose = () => { wsStatus = 'closed'; updateStats(); console.log('[ws] closed'); setTimeout(openWS, 1000); };
  ws.onerror = (e) => { wsStatus = 'error'; updateStats(); console.warn('[ws] error', e); };

  ws.onmessage = (ev)=>{
    // debug: always log the frame so we can see if anything arrives
    console.log('[ws] msg', ev.data);
    try{
      const msg = JSON.parse(ev.data);
      // expected: { device_id, x, y, z, ts, topic }
      if (!showAllCb.checked && selectedDevice && msg.device_id !== selectedDevice) return;
      addRow(msg);
      logRaw(msg);
      totalSamples += 1;
      recentTimes.push(Date.now());
      updateStats();
    }catch(e){ /* ignore non-JSON frames */ }
  };
}

/* ---------- wiring ---------- */
saveAuthBtn.onclick = ()=>{
  API_BASE = apiBaseEl.value.trim() || API_BASE;
  API_KEY  = apiKeyEl.value.trim();
  localStorage.setItem('demo.apiBase', API_BASE);
  localStorage.setItem('demo.apiKey', API_KEY);
  authStatus.textContent = 'Saved';
  openWS();
};
refreshBtn.onclick = refreshDevices;
deviceSel.onchange = ()=>{ selectedDevice = deviceSel.value; refreshStatus(); };

/* init */
openWS();
refreshDevices();
setInterval(refreshStatus, 3000);
</script>
</body>
</html>
